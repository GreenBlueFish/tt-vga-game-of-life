# Tiny Tapeout project information
project:
  title:        "Tiny Tapeout VGA Interface"      # Project title
  author:       "ECE 298A"                         # Your name
  discord:      ""                                 # Your discord username (optional)
  description:  "VGA (640x480@60) output interface for the TinyVGA Pmod"  # One line description
  language:     "Verilog"                          # Verilog, SystemVerilog, VHDL, etc.
  clock_hz:     25175000                           # VGA pixel clock in Hz
  # How many tiles your design occupies. A single tile is about 167x108 uM.
  tiles: "1x1"                                      # Valid: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2

  # Your top module name must start with "tt_um_". Make it unique.
  top_module:  "tt_um_vga_interface"

  # List your project's source files here. Must be in ./src, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "vga_timing.v"
    - "golchip.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs (control interface, serial load)
  ui[0]: "speed0"
  ui[1]: "speed1"
  ui[2]: ""
  ui[3]: ""
  ui[4]: "load_data"
  ui[5]: "load_en"
  ui[6]: "run"
  ui[7]: "step"

  # Outputs (TinyVGA Pmod)
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins (unused)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
